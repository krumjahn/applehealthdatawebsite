<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Data AI Analyzer</title>
    <!-- No-JS fallback uses ct=website. With JS, DNT and the GA disable flag replace immediately. Otherwise the redirect waits for the GA callback (or ~400ms). -->
    <meta http-equiv="refresh" content="1; url=https://apps.apple.com/us/app/health-data-ai-analyzer/id6749297170?ct=website&mt=8">
    <link rel="canonical" href="https://apps.apple.com/us/app/health-data-ai-analyzer/id6749297170?ct=website&mt=8">
    <script>
      var measurementId = 'G-8SMQRLT4VS';
      // Campaign token from ?c=, e.g. /go/website.html?c=convert_tool_hero
      var campaign = 'website';
      try {
        var c = new URLSearchParams(window.location.search).get('c');
        if (c && /^[a-z0-9_]{1,40}$/.test(c)) campaign = c;
      } catch (e) {}

      // TODO: once the real App Store Connect provider token is known, append '&pt=<token>'
      // (Apple only surfaces ct= campaigns in ASC analytics when a valid pt= accompanies them)
      var dest = 'https://apps.apple.com/us/app/health-data-ai-analyzer/id6749297170?ct=' + campaign + '&mt=8';
      var disabled = navigator.doNotTrack === '1' || window['ga-disable-' + measurementId];

      // Opted-out visitors never load gtag. Everyone else waits for the beacon:
      // gtag.js is async, so a synchronous location.replace drops app_store_redirect
      // on a cold cache. The event callback leaves once the beacon is queued.
      // event_timeout covers a loaded library that never sends; setTimeout covers
      // gtag.js itself never arriving (blocked, offline, slow).
      if (disabled) {
        window.location.replace(dest);
      } else {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', measurementId);

        var redirected = false;
        function goToStore() {
          if (redirected) return;
          redirected = true;
          window.location.replace(dest);
        }

        window.gtag('event', 'app_store_redirect', {
          'event_category': 'conversion',
          'event_label': campaign,
          'source': campaign,
          'transport_type': 'beacon',
          'event_callback': goToStore,
          'event_timeout': 400
        });

        setTimeout(goToStore, 400);

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
        document.head.appendChild(script);
      }
    </script>
</head>
<body>
    <p>Redirecting to App Store...</p>
    <noscript><p><a href="https://apps.apple.com/us/app/health-data-ai-analyzer/id6749297170?ct=website&mt=8">Open Health Data AI Analyzer on the App Store</a></p></noscript>
</body>
</html>
